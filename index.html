<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="תמלול AI" />
  <title>שער כניסה מוצפן (AES-256) - מערכת תמלול AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #042f2e 0%, #0f172a 55%, #134e4a 100%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.98);
      color: #0f172a;
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .icon-box {
      width: 68px;
      height: 68px;
      background: #0d9488;
      color: white;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 32px;
      box-shadow: 0 10px 20px rgba(13, 148, 136, 0.3);
    }
    .badge {
      display: inline-block;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: #0f172a; }
    p { font-size: 13.5px; color: #475569; line-height: 1.5; margin-bottom: 18px; }
    .input-box {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 4px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-box:focus { border-color: #0d9488; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 15px 20px;
      background: #0d9488;
      color: white;
      font-weight: 800;
      font-size: 16px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      border-radius: 16px;
      box-shadow: 0 8px 16px rgba(13, 148, 136, 0.25);
      transition: background 0.2s;
    }
    .btn:hover { background: #0f766e; }
    .btn-go {
      background: #059669;
      margin-top: 12px;
      display: none;
    }
    .status { font-size: 12px; color: #64748b; margin-top: 14px; }
    .error { color: #e11d48; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">🔐</div>
    <div class="badge">הצפנת קצה-לקצה AES-256-GCM</div>
    <h1>שער כניסה מאובטח ומוצפן</h1>
    <p id="desc">הזן קוד PIN (1234) או סיסמה אישית כדי לפענח את כתובת השרת ולהיכנס למערכת התמלול:</p>

    <form id="unlockForm">
      <input
        id="secretInput"
        type="password"
        inputmode="numeric"
        placeholder="קוד PIN או סיסמה"
        class="input-box"
        autocomplete="current-password"
        required
      />
      <button type="submit" id="submitBtn" class="btn">פענח והיכנס למערכת ←</button>
    </form>

    <a id="directGoBtn" href="#" class="btn btn-go">לחץ כאן אם המעבר האוטומטי לא נפתח ←</a>

    <div id="statusText" class="status">אפס מידע חשוף ב-GitHub – כתובת השרת מוצפנת ב-AES-256</div>
  </div>

  <script>
    const GIST_ID = '0d5fc2ae7784e2ea83db1ff61bf21de5';
    const STORAGE_KEY = 'therapynotes_portal_key_v2';

    function base64ToBytes(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    async function decryptVault(vault, secret) {
      const enc = new TextEncoder();
      const salt = base64ToBytes(vault.salt);
      const iv = base64ToBytes(vault.iv);
      const data = base64ToBytes(vault.data);

      const baseKey = await crypto.subtle.importKey(
        'raw',
        enc.encode(secret.trim()),
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );

      const aesKey = await crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: salt,
          iterations: 100000,
          hash: 'SHA-256'
        },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );

      const decryptedBuf = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        aesKey,
        data
      );

      return new TextDecoder().decode(decryptedBuf);
    }

    async function tryUnlockWithSecret(secret, isAuto = false) {
      const statusEl = document.getElementById('statusText');
      const submitBtn = document.getElementById('submitBtn');
      const directGoBtn = document.getElementById('directGoBtn');
      try {
        statusEl.className = 'status';
        statusEl.textContent = 'מפענח כתובת שרת ב-AES-256...';
        submitBtn.disabled = true;

        const res = await fetch(`https://api.github.com/gists/${GIST_ID}?t=${Date.now()}`, {
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('שגיאת תקשורת בטעינת הנתונים המוצפנים');
        const gist = await res.json();
        const raw = gist.files && gist.files['tunnel_state.json'] && gist.files['tunnel_state.json'].content;
        const parsed = JSON.parse(raw);

        if (!parsed.vaults || !Array.isArray(parsed.vaults)) {
          throw new Error('לא נמצא מידע מוצפן');
        }

        let decryptedUrl = null;
        for (const v of parsed.vaults) {
          try {
            const candidate = await decryptVault(v, secret);
            if (candidate && candidate.startsWith('https://')) {
              decryptedUrl = candidate.trim();
              break;
            }
          } catch (innerErr) {}
        }

        if (!decryptedUrl) {
          if (isAuto) {
            localStorage.removeItem(STORAGE_KEY);
            statusEl.textContent = 'הזן קוד PIN או סיסמה אישית לכניסה';
            submitBtn.disabled = false;
            return;
          }
          throw new Error('קוד PIN או סיסמה שגויים – הפענוח נכשל');
        }

        localStorage.setItem(STORAGE_KEY, secret.trim());
        directGoBtn.href = decryptedUrl;
        directGoBtn.style.display = 'inline-block';
        statusEl.textContent = 'הפענוח הצליח! מעביר למערכת התמלול...';
        window.location.href = decryptedUrl;
      } catch (err) {
        submitBtn.disabled = false;
        statusEl.className = 'status error';
        statusEl.textContent = err.message || 'שגיאה בפענוח הכניסה';
      }
    }

    document.getElementById('unlockForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('secretInput').value;
      if (val) tryUnlockWithSecret(val, false);
    });

    const savedSecret = localStorage.getItem(STORAGE_KEY);
    if (savedSecret) {
      document.getElementById('secretInput').value = savedSecret;
      tryUnlockWithSecret(savedSecret, true);
    }
  </script>
</body>
</html>
